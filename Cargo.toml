[workspace]
resolver = "2"
members = [
    "crates/plugin",
    "crates/sink-grpc",
    "crates/sink-kafka",
    "crates/sink-ws",
    "crates/common",
    "crates/proto",
    "crates/sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/your-org/geyser-tap"
keywords = ["solana", "geyser", "streaming", "grpc", "kafka"]
categories = ["cryptography::cryptocurrencies", "network-programming"]

[workspace.dependencies]
# Solana dependencies - pin to specific validator version for ABI compatibility
solana-geyser-plugin-interface = "1.18"
solana-sdk = "1.18"
solana-transaction-status = "1.18"

# Async runtime
tokio = { version = "1.36", features = ["full", "sync", "rt-multi-thread"] }

# gRPC
tonic = "0.11"
tonic-build = "0.11"
prost = "0.12"
prost-types = "0.12"

# Kafka (ssl and sasl disabled for cross-platform builds; enable in production)
rdkafka = { version = "0.36", features = ["cmake-build", "zstd"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bs58 = "0.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"

# Configuration
config = "0.14"
toml = "0.8"

# FFI safety
libc = "0.2"

# Utilities
crossbeam-channel = "0.5"
parking_lot = "0.12"
once_cell = "1.19"
dashmap = "5.5"
bytes = { version = "1.5", features = ["serde"] }
serde_bytes = "0.11"

# Internal crates
geyser-tap-common = { path = "crates/common" }
geyser-tap-proto = { path = "crates/proto" }
geyser-tap-sink-grpc = { path = "crates/sink-grpc" }
geyser-tap-sink-kafka = { path = "crates/sink-kafka" }
geyser-tap-sink-ws = { path = "crates/sink-ws" }
geyser-tap-sdk = { path = "crates/sdk" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"  # Critical: prevents unwinding across FFI boundary
opt-level = 3
debug = false
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"
