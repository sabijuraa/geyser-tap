# CI for geyser-tap
#
# Everything here runs on a plain GitHub-hosted runner with no external
# services. The end-to-end checks that need a live Solana validator and a Kafka
# broker are deliberately NOT run here -- see "What CI does not cover" at the
# bottom of this file.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Fewer codegen units and no incremental state: CI builds once and throws the
  # machine away.
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # Formatting, lints and rustdoc.
  #
  # Split from the test job so a lint failure is obvious at a glance, and
  # because these only need check-level compilation.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            cmake \
            pkg-config

      # Must match rust-toolchain.toml. The plugin is a cdylib whose entry point
      # returns a Rust trait object across dlopen, and vtable layout is not
      # ABI-stable across compiler versions -- a plugin built with a different
      # rustc than the target validator segfaults it on load. Validator 1.18.26
      # is built with 1.75.0, so that is what CI builds with too.
      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build rustdoc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # ---------------------------------------------------------------------------
  # Build and unit/integration tests.
  #
  # The whole test suite is in-process: it exercises config parsing, update
  # types, filtering, sink health and the FFI panic wrapper. None of it opens a
  # socket or talks to a broker, so it runs unmodified on a bare runner.
  # ---------------------------------------------------------------------------
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            cmake \
            pkg-config

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@1.75.0

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      # --all-targets so examples and benches are compiled too; they are part of
      # the public surface and should not be allowed to rot.
      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Release artifact.
  #
  # The deliverable is a loadable cdylib, so CI builds it and asserts it really
  # is a shared object exporting the symbol the validator looks up. This catches
  # profile regressions that a debug build would not -- notably panic=abort,
  # which silently disables the catch_unwind guarding every FFI callback.
  # ---------------------------------------------------------------------------
  plugin:
    name: Release Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            cmake \
            pkg-config

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@1.75.0

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          key: plugin

      - name: Build plugin (release)
        run: cargo build --release -p geyser-tap-plugin

      - name: Verify the artifact is a loadable plugin
        run: |
          set -euo pipefail
          SO=target/release/libgeyser_tap_plugin.so
          file "$SO"

          # The validator resolves this symbol via dlsym; without it the plugin
          # cannot be loaded at all.
          nm -D "$SO" | grep -q ' T _create_plugin'
          echo "_create_plugin is exported"

          # Unwinding tables must be present. Under panic="abort" they are not,
          # and catch_unwind at the FFI boundary becomes a no-op, so a plugin
          # panic would abort the validator instead of being contained.
          nm -D "$SO" | grep -q '_Unwind_Resume'
          echo "unwind support present (panic=unwind)"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: libgeyser_tap_plugin
          path: target/release/libgeyser_tap_plugin.so
          if-no-files-found: error

# -----------------------------------------------------------------------------
# What CI does not cover
#
# The end-to-end verification cannot run on a standard GitHub runner, and is a
# manual procedure instead (documented in README.md):
#
#   * Streaming end-to-end needs a real solana-test-validator to dlopen the
#     plugin and produce slots. There is no published action for this, the
#     validator must match the plugin's interface version *and* rustc, and a
#     usable run needs a ledger plus minutes of wall clock.
#
#   * The Kafka sink needs a live broker, and proving it end-to-end needs a
#     validator producing into it. A broker alone would only test that rdkafka
#     can connect, which is not the property worth asserting.
#
# Both were verified locally against real infrastructure; see the "Verified"
# section of README.md. They are left out of CI rather than stubbed, so that a
# green run here means exactly what it appears to mean.
#
# Supply-chain checks (cargo-audit / cargo-deny) are also not gated here yet,
# and that is a real gap rather than an oversight. deny.toml currently bans
# `openssl` and `native-tls`, but both are in the dependency tree via
# reqwest -> solana-metrics, so `cargo deny check bans` fails against the
# policy as written. Pinning solana 1.18.26 for ABI compatibility also limits
# which transitive advisories can be resolved by upgrading. Turning these into
# merge gates needs that triage done first; wiring them up while they fail, or
# while their failures are ignored, would be worse than leaving them out.
# -----------------------------------------------------------------------------
